class: aimnet.models.AIMNet2
kwargs:
    nfeature: 16
    d2features: true
    ncomb_v: 12
    hidden:
        - [512, 380]
        - [512, 380]
        - [512, 380, 380]
    aim_size: 256
    aev:
        rc_s: 5.0
        nshifts_s: 16
    outputs:
        energy_mlp:
            class: aimnet.modules.Output
            kwargs:
                n_in: 256
                n_out: 1
                key_in: aim
                key_out: energy
                mlp:
                    activation_fn: torch.nn.GELU
                    last_linear: true
                    hidden: [128, 128]

        atomic_shift:
            class: aimnet.modules.AtomicShift
            kwargs:
                key_in: energy
                key_out: energy

        atomic_sum:
            class: aimnet.modules.AtomicSum
            kwargs:
                key_in: energy
                key_out: energy

        lrcoulomb:
            class: aimnet.modules.LRCoulomb
            kwargs:
                rc: 4.6
                key_in: charges
                key_out: energy

        dftd3:
            class: aimnet.modules.DFTD3
            kwargs:
                # ⚠️ B3LYP-D3(BJ) 的阻尼参数 —— 必须与我们的标签一致！
                # 原文件（aimnet2_dftd3_wb97m.yaml）里是 ωB97M 的 s8=0.3908 a1=0.5660 a2=3.1280。
                # 那组参数与 B3LYP 差 0.18 eV = 4.1 kcal/mol（20 原子分子实测），
                # 而我们的目标精度只有 1–2 kcal/mol —— 不改就是让 NN 去硬学一个系统性错误。
                #
                # 来源：QCEngine/Psi4 的权威参数表（s6=1.0 s8=1.9889 a1=0.3981 a2=4.4211）
                # 验证：2026-07-14 与 PySCF 的 B3LYP-D3(BJ)（就是生成我们标签的那套）数值对账 ——
                #       同一 20 原子分子，PySCF −0.035687592 Ha = −0.971111 eV，
                #       AIMNet2 DFTD3 −0.971108615 eV，|Δ| = 2.4e-6 eV ✅ 逐位一致。
                #       （注意 AIMNet2 的 DFTD3 输出单位是 eV，不是 Hartree。）
                s8: 1.9889
                a1: 0.3981
                a2: 4.4211
