# NHC0801 resource profiles (parallel strategy S: single first, dual after claim+calibration)
# Live chemistry is NOT authorized by this file. Claim + selection receipt required for dual.

schema: nhc0801-resource-profiles-v001
project: NHC0801
parallel_strategy: S
scope: C  # pilot 5 roots first; expand roots later

host_policy:
  shared_node: true
  never_assume_all_logical_cpus: true
  smt_default: disabled
  physical_cores_preferred: true
  require_live_claim_before_chemistry: true
  require_selection_receipt_for_dual: true
  write_root_only: "$WJW/NHC0801"

# Official safe default (handoff single_27_physical_v1)
profiles:
  single_27_physical_v1:
    status: official_default
    worker_count: 1
    root_concurrency: 1
    endpoint_concurrency: 1
    threads_per_worker: 27
    smt: false
    # Logical CPU affinity as recorded in pilot (physical-core sampling style)
    cpu_affinity_note: "physical set historically bound as 0,2-27 on shared node"
    cpu_lists:
      - "0,2-27"
    pyscf_max_memory_mb_per_worker: 64000
    aggregate_memory_budget_mb: 64000
    host_memory_reserve_mb: 32000
    numa_local_required: true
    retry: false
    fallback: false
    may_start_chemistry_without_claim: false

  dual_14_13_physical_v1:
    status: calibration_candidate_only
    worker_count: 2
    root_concurrency: 2
    endpoint_concurrency: 1
    threads_per_worker: [14, 13]
    smt: false
    cpu_lists:
      - "0,2-14"
      - "15-27"
    pyscf_max_memory_mb_per_worker: 32000
    aggregate_memory_budget_mb: 64000
    host_memory_reserve_mb: 32000
    numa_local_required: true
    retry: false
    fallback: false
    minimum_throughput_improvement_vs_single: 0.05
    may_start_chemistry_without_claim: false
    requires_isolated_benchmark_receipt: true

claim_gates:
  two_sample_required: true
  selected_cpus_must_be_idle: true
  memory_psi_avg10_max: 0.01
  io_psi_avg10_max: 0.05
  min_mem_available_bytes: 100000000000  # ~93 GiB floor; tighten per profile at claim time
  min_disk_free_bytes: 50000000000

throughput_collection:
  default_profile: single_27_physical_v1
  escalate_to: dual_14_13_physical_v1
  escalate_only_after:
    - live_claim_pass
    - isolated_benchmark_pass
    - selection_receipt_written
  never_auto_n_gt_2_without_new_catalog_version: true

forbidden:
  - use_all_112_logical_cpus_without_receipt
  - smt_54_as_default
  - chemistry_on_rejected_claim
  - write_outside_nhc0801
