# NHC0801 Validation-only numeric calibration (preregistered before training)
# Schema matches tvt_gates.validate_numeric_addendum
# Authority: mindmap.md steps 6–9. Must NOT be revised after Final Test is opened.
# Frozen: 2026-08-01. Re-freeze requires explicit user authority + new version id.

schema: phase9b-aimnet2-numeric-addendum-v1
status: FROZEN
chosen_before_final_test: true
version: NUMERIC_CALIBRATION_V001
project: NHC0801
generation_binding: phase9b-aimnet2-nhc-p01-tvt-20260801-v001

# Absolute mean absolute error gate vs Pure-PySCF parent deprotonation labels (kcal/mol)
label_error_tolerance_kcal_mol: 3.0

# Allowed mean signed bias (predicted route label − Pure-PySCF reference), kcal/mol
signed_bias_tolerance_kcal_mol: 1.5

catastrophic_failure_definition: >-
  Any of: wrong charge/multiplicity; topology/bond change vs frozen root;
  fragmentation/collision; non-finite energy/geometry; failed SCF at parent GAU;
  FAILED_PARENT_HANDOFF; AIMNet2 energy written into label; single_point_only=true.

# Number of Validation roots allowed to hit catastrophic failure and still compete
allowed_validation_failure_count: 0

epoch_zero_non_regression_rule: >-
  A fine-tuned checkpoint is ineligible if, after full scientific Validation,
  its mean absolute label error vs Pure-PySCF is worse than epoch-0 by more than
  signed_bias_tolerance_kcal_mol, or it fails any hard identity/structure gate
  that epoch-0 passed on the same roots.

# Soft lower bound on PySCF burden reduction vs epoch-0 (0.0 = no hard cut;
# used as ranking key after hard gates). Burden = parent opt steps + SCF cycles.
minimum_pyscf_burden_reduction_fraction: 0.0

quick_checkpoint_shortlist_rule:
  purpose: frame-loss screening only; never final model selection
  maximum_count_per_seed: 4
  selection: deterministic_loss_plus_chronological_anchors
  may_select_final_model: false

# Order is lexicographic for scientific selection (mindmap step 9)
scientific_checkpoint_selection_rule:
  - all_identity_and_structure_hard_gates
  - no_catastrophic_failure_beyond_budget
  - label_mae_within_tolerance_vs_pure_pyscf
  - signed_bias_within_tolerance
  - epoch_zero_non_regression
  - minimize_label_mae
  - maximize_pyscf_burden_reduction
  - minimize_wall_time
  - lowest_seed_then_lowest_epoch_tiebreak

quick_validation_may_select_final_model: false
single_point_only: false
full_parent_optimization_required: true
aimnet2_energy_never_enters_label: true

parent_protocol:
  id: Parent-Level Protocol P01
  sha256: 227c22a527e567bc4de873ab743fe9f493779eccbb1a698d2913c87695ebf87a
  functional: wb97m-d3bj
  basis: def2-TZVPP

forbidden_parent_stacks:
  - production_two_endpoint_b3lyp_def2_svp
  - aimnet2_preopt_fmax_0p05_as_parent_stop

ratification:
  authority: user_explicit_preregister_before_training_2026-08-01
  frozen_before_live_training: true
  frozen_before_final_test_open: true
  may_revise_after_looking_at_final_test: false
  notes: >-
    Values are Validation-only selection thresholds for NHC0801 pilot.
    They clear NUMERIC_CALIBRATION_RULE_NOT_PREREGISTERED. They do not authorize
    live training, epoch-0 chemistry, or Final Test open.
