# NHC0801 resource profiles V002 — auto-fill scheduler
# Authority companion: docs/contracts/RESOURCE_SCHEDULING_V001.md
#
# REVISION 2026-08-02c (trial profile — user directed):
#   t = 10 logical threads / endpoint
#   C_reserve = 12 logical CPUs (never bound by auto-fill)
#   M_per = 8 GiB/endpoint (from measured HWM ~3.5–4.5 GiB)
#   M_reserve = 40 GiB host
#   Teacher wave: 10 endpoints (5 roots × cation+neutral) in one wave when idle
#
# Prior:
#   2026-08-02b: t=8, no explicit CPU reserve, 8 GiB/endpoint
#   2026-08-02a: revoked 32 GiB/endpoint overestimate
#
# Does NOT delete V001. Live chemistry still requires claim + explicit gates.

schema: nhc0801-resource-profiles-v002
project: NHC0801
parallel_strategy: auto_fill
revision: "2026-08-02c"
supersedes_default_of: nhc0801-resource-profiles-v001
revokes:
  - "2026-08-02a_memory_32gib_per_endpoint_overestimate"
  - "2026-08-02b_t8_no_cpu_reserve"  # superseded by trial t=10 + reserve 12
keeps_v001_for: historical_receipts_and_opt_in_fallback

host_policy:
  shared_node: true
  logical_cpus_total: 112
  physical_cores_total: 56
  smt_present: true
  cpu_pool_mode: all_logical_0_111_minus_reserve
  cpu_reserve_count: 12
  # Prefer high indices as soft reserve for login/other (implementation may remap)
  cpu_reserve_list: "100-111"
  never_leave_omp_unset: true
  require_live_claim_before_chemistry: true
  write_root_only: "$WJW/NHC0801"
  host_memory_reserve_gb: 40
  memory_per_endpoint_gb: 8
  threads_per_endpoint: 10
  n_cap: null
  endpoint_independence: true
  teacher_endpoint_queue_typical: 10
  teacher_wave_concurrent_target: 10
  gpu_train_default_count: 1
  gpu_gau_loose_separate_from_train: true
  parent_pyscf_cpu_only: true
  measurement_notes: >-
    2026-08-02 nhc614 parent workers VmHWM ≈ 3.5–4.5 GiB; MemAvailable ≈ 236 GiB
    with 3 workers. Trial 02c: user wants t=10 and leave 12 cores for other work.

profiles:
  auto_fill_112_t10_r12_v1:
    status: official_default_v002
    description: >-
      Trial: 10 threads/endpoint, reserve 12 CPUs (100-111), 8 GiB/endpoint,
      target 10 concurrent endpoints for full teacher wave.
    worker_count: dynamic
    root_concurrency: dynamic
    endpoint_concurrency: dynamic
    threads_per_worker: 10
    thread_unit: logical
    cpu_pool: "0-99"
    cpu_reserve_list: "100-111"
    smt: allowed_in_pool
    pyscf_max_memory_mb_per_worker: 7000
    memory_per_endpoint_mb: 8192
    aggregate_memory_budget_mb: null
    host_memory_reserve_mb: 40960
    numa_local_preferred: true
    numa_local_required: false
    formula:
      N_cpu: "floor(idle_cpus_in_pool / 10)"
      N_mem: "floor((mem_available_gb - 40) / 8)"
      N: "max(0, min(N_cpu, N_mem))"
      note: "pool is 0-99 (100 CPUs); reserve 100-111 never scheduled"
    idle_cpu_util_threshold_pct: 15
    claim_two_sample_interval_s: 3.0
    may_start_chemistry_without_claim: false
    retry: false
    fallback: false
    parent_pyscf_cpu_only: true

  # Keep previous default id as alias for scripts that still pass auto_fill_112_t8_v1
  auto_fill_112_t8_v1:
    status: superseded_alias
    description: "Alias → same as auto_fill_112_t10_r12_v1 for one release (trial 02c)"
    worker_count: dynamic
    root_concurrency: dynamic
    endpoint_concurrency: dynamic
    threads_per_worker: 10
    thread_unit: logical
    cpu_pool: "0-99"
    cpu_reserve_list: "100-111"
    smt: allowed_in_pool
    pyscf_max_memory_mb_per_worker: 7000
    memory_per_endpoint_mb: 8192
    aggregate_memory_budget_mb: null
    host_memory_reserve_mb: 40960
    numa_local_preferred: true
    numa_local_required: false
    formula:
      N_cpu: "floor(idle_cpus_in_pool / 10)"
      N_mem: "floor((mem_available_gb - 40) / 8)"
      N: "max(0, min(N_cpu, N_mem))"
    idle_cpu_util_threshold_pct: 15
    claim_two_sample_interval_s: 3.0
    may_start_chemistry_without_claim: false
    retry: false
    fallback: false
    parent_pyscf_cpu_only: true

  legacy_single_27_physical_v1_bridge:
    status: fallback_opt_in
    worker_count: 1
    threads_per_worker: 27
    thread_unit: logical_affinity_set
    cpu_lists:
      - "0,2-27"
    host_memory_reserve_mb: 32768
    pyscf_max_memory_mb_per_worker: 64000
    memory_per_endpoint_mb: 64000
    may_start_chemistry_without_claim: false

gpu_policy:
  train:
    devices: 1
    selection: configurable_index_or_first_free
  gau_loose_aimnet2:
    devices: 1
    selection: first_free_not_equal_to_train
  free_gpu_heuristic:
    memory_used_mib_max: 500
    utilization_pct_max: 5

claim_gates:
  two_sample_required: true
  selected_cpus_must_be_idle: true
  memory_psi_avg10_max: 0.05
  io_psi_avg10_max: 0.05
  min_mem_available_bytes: 42949672960
  min_disk_free_bytes: 50000000000

forbidden:
  - unset_omp_on_pyscf_worker
  - parent_pyscf_sharing_train_gpu
  - systemd_or_cron_resident_scheduler
  - auto_start_final_test
  - write_outside_nhc0801
  - rsync_delete_outside_nhc0801
  - use_revoked_32gib_endpoint_budget
  - schedule_on_reserved_cpus_100_111

ratification:
  user_interactive_confirm: 2026-08-02
  trial_revision: 2026-08-02c
  notes: >-
    User trial: t=10, reserve 12 cores (100-111), 8 GiB/endpoint, 10 endpoints one wave.
    Re-measure wall time vs t=8 after trial; may revert or adjust.
